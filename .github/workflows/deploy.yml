# main branch에 push하면 Astro 사이트를 빌드해 GitHub Pages에 배포한다.
# 사전 설정: GitHub repository > Settings > Pages > Source 를 "GitHub Actions"로 변경한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 선택 사항. repository > Settings > Secrets and variables > Actions 의
      # Variables 또는 Secrets 탭, 둘 중 어디에 등록해도 반영된다.
      # 비어 있으면 Analytics / AdSense script를 로드하지 않는다.
      PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID || secrets.PUBLIC_GA_ID }}
      PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT || secrets.PUBLIC_ADSENSE_CLIENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload site
        uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
